version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: autolog_postgres
    restart: always
    environment:
      POSTGRES_USER: autolog
      POSTGRES_PASSWORD: autolog1234
      POSTGRES_DB: autolog_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: