server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/autolog_db
    username: autolog
    password: autolog1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect