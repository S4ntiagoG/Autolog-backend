<main class="flex min-h-dvh items-center justify-center bg-[#111113] px-4 py-8 text-neutral-100">
  <section class="w-full max-w-sm overflow-hidden rounded-md border border-neutral-800 bg-[#1e1e20] shadow-2xl shadow-black/40">
    <header class="flex min-h-28 items-center justify-center border-b border-neutral-800 bg-[#151517] px-6 py-5">
      <img class="brand-mark" src="/ciclo-motor-la-villa.jpeg" alt="Ciclo Motor La Villa" />
    </header>

    <div class="p-6 sm:p-7">
      <p class="text-[10px] font-semibold uppercase text-neutral-400">Power by</p>
      <h1 class="mt-1 text-3xl font-extrabold leading-none text-[#D32F2F]">AUTOLOG</h1>

      <form class="mt-7 space-y-5" [formGroup]="form" (ngSubmit)="search()" novalidate>
        <div>
          <label for="plate" class="mb-1.5 block text-[10px] font-semibold uppercase text-neutral-300">Placa</label>
          <input
            id="plate"
            type="text"
            formControlName="plate"
            (input)="normalizePlateInput($event)"
            autocomplete="off"
            autocapitalize="characters"
            maxlength="6"
            placeholder="Ej. ABC123"
            class="w-full rounded-sm border border-neutral-600 bg-neutral-50 px-3 py-3 text-sm font-mono uppercase text-neutral-900 placeholder-neutral-500 focus:border-red-600 focus:outline-none focus:ring-1 focus:ring-red-600"
            [class.border-red-500]="showError('plate')"
            [attr.aria-invalid]="showError('plate')"
            aria-describedby="plate-error"
          />
          @if (showError('plate')) {
            <p id="plate-error" class="mt-1 text-xs text-red-300">{{ errorFor('plate') }}</p>
          }
        </div>

        <div>
          <label for="identificationNumber" class="mb-1.5 block text-[10px] font-semibold uppercase text-neutral-300">Documento de identidad</label>
          <input
            id="identificationNumber"
            type="text"
            formControlName="identificationNumber"
            autocomplete="off"
            placeholder="NIT, Pasaporte, TI, CC"
            class="w-full rounded-sm border border-neutral-600 bg-neutral-50 px-3 py-3 text-sm font-mono text-neutral-900 placeholder-neutral-500 focus:border-red-600 focus:outline-none focus:ring-1 focus:ring-red-600"
            [class.border-red-500]="showError('identificationNumber')"
            [attr.aria-invalid]="showError('identificationNumber')"
            aria-describedby="document-error"
          />
          @if (showError('identificationNumber')) {
            <p id="document-error" class="mt-1 text-xs text-red-300">{{ errorFor('identificationNumber') }}</p>
          }
        </div>

        @if (error()) {
          <p role="alert" class="rounded-sm border border-red-900 bg-red-950/60 p-3 text-xs leading-relaxed text-red-200">{{ error() }}</p>
        }

        <button
          type="submit"
          [disabled]="loading()"
          class="mt-7 flex min-h-11 w-full items-center justify-center rounded-sm bg-[#D32F2F] px-4 py-3 text-[11px] font-bold uppercase text-white transition hover:bg-[#b71c1c] disabled:cursor-wait disabled:opacity-60"
        >
          @if (loading()) { Buscando vehículo… } @else { Buscar vehículo }
        </button>
      </form>
    </div>
  </section>
</main>
